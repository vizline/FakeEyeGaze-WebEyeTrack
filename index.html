<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Badanie oceny wiarygodności informacji</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="webeyetrack.css" />
  <style>.btn[href]{text-decoration:none;display:inline-block}.gaze-status{position:fixed;right:18px;top:16px;z-index:100002;background:#10212b;color:#fff;padding:9px 13px;border-radius:9px;font:700 13px/1.2 ui-monospace,monospace}.custom-gaze-marker{display:none;position:fixed;left:0;top:0;z-index:100001;width:24px;height:24px;border:3px solid #00e5d4;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px #10212b}.custom-gaze-marker:before,.custom-gaze-marker:after{content:"";position:absolute;background:#10212b}.custom-gaze-marker:before{width:30px;height:2px;left:-6px;top:8px}.custom-gaze-marker:after{width:2px;height:30px;left:8px;top:-6px}.results-panel{width:min(980px,100%);margin:40px auto}.heatmaps{display:grid;gap:32px}.result-post{position:relative;overflow:hidden;border:1px solid #ccd5dc;border-radius:16px;background:#fff}.result-text{height:150px;padding:26px 30px;display:flex;align-items:center;font-size:1.65rem;line-height:1.2;font-weight:750}.result-post img{display:block;width:100%;height:430px;object-fit:cover}.result-post canvas{position:absolute;inset:0;z-index:2;pointer-events:none}</style>
  <style>.cal-point.waiting{background:#9aa4ad;cursor:wait}.cal-point:disabled{cursor:default}</style>
  <style>.result-post-shell{position:relative}.result-post-shell canvas{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:18px}</style>
</head>
<body>
  <div id="attentionAlert" aria-live="assertive"><strong>Obserwuj ekran</strong></div>
  <main id="app" class="shell"></main>
  <video id="webcam" autoplay playsinline muted aria-hidden="true"></video>
  <script type="module" src="/app.js"></script>
</body>
</html>
